apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: elice-microservices-production
  namespace: argocd
  labels:
    environment: production
    criticality: high
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Elice DevOps 마이크로서비스 플랫폼 - 운영 환경 (고가용성)
  
  sourceRepos:
  - 'https://github.com/dongkoony/microservices-gitops'
  
  destinations:
  - namespace: 'elice-devops-prod'
    server: https://kubernetes.default.svc
  
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: ReplicaSet
  - group: 'networking.k8s.io'
    kind: Ingress
  - group: 'networking.k8s.io'
    kind: NetworkPolicy
  - group: 'autoscaling'
    kind: HorizontalPodAutoscaler
  - group: 'policy'
    kind: PodDisruptionBudget
  - group: 'monitoring.coreos.com'
    kind: ServiceMonitor
  
  # 운영환경 보안 정책 강화
  orphanedResources:
    warn: true
    ignore:
    - group: ''
      kind: Secret
      name: '*-tls'
  
  roles:
  - name: prod-admin
    description: 운영 환경 관리자 (완전 수동 승인)
    policies:
    - p, proj:elice-microservices-production:prod-admin, applications, sync, elice-microservices-production/*, allow
    - p, proj:elice-microservices-production:prod-admin, applications, get, elice-microservices-production/*, allow
    - p, proj:elice-microservices-production:prod-admin, logs, get, elice-microservices-production/*, allow
    groups:
    - elice-devops:production-team
    - elice-devops:platform-engineers
  
  - name: prod-viewer
    description: 운영 환경 조회 권한 (모니터링 용도)
    policies:
    - p, proj:elice-microservices-production:prod-viewer, applications, get, elice-microservices-production/*, allow
    - p, proj:elice-microservices-production:prod-viewer, logs, get, elice-microservices-production/*, allow
    groups:
    - elice-devops:monitoring-team
    - elice-devops:sre-team