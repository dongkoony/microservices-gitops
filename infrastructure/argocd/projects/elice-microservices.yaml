apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: elice-microservices-dev
  namespace: argocd
  labels:
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Elice DevOps 마이크로서비스 플랫폼 - 개발 환경
  
  # 소스 저장소
  sourceRepos:
  - 'https://github.com/dongkoony/microservices-gitops'
  
  # 배포 가능한 대상
  destinations:
  - namespace: 'elice-devops-dev'
    server: https://kubernetes.default.svc
  - namespace: 'argocd'
    server: https://kubernetes.default.svc
  
  # 허용되는 리소스
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding
  
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: ReplicaSet
  - group: 'networking.k8s.io'
    kind: Ingress
  - group: 'networking.k8s.io'
    kind: NetworkPolicy
  - group: 'autoscaling'
    kind: HorizontalPodAutoscaler
  - group: 'policy'
    kind: PodDisruptionBudget
  - group: 'monitoring.coreos.com'
    kind: ServiceMonitor
  
  roles:
  - name: dev-admin
    description: 개발 환경 전체 관리자
    policies:
    - p, proj:elice-microservices-dev:dev-admin, applications, *, elice-microservices-dev/*, allow
    - p, proj:elice-microservices-dev:dev-admin, logs, get, elice-microservices-dev/*, allow
    - p, proj:elice-microservices-dev:dev-admin, exec, create, elice-microservices-dev/*, allow
    groups:
    - elice-devops:dev-team
  
  - name: dev-viewer
    description: 개발 환경 조회 권한
    policies:
    - p, proj:elice-microservices-dev:dev-viewer, applications, get, elice-microservices-dev/*, allow
    - p, proj:elice-microservices-dev:dev-viewer, logs, get, elice-microservices-dev/*, allow
    groups:
    - elice-devops:all-users

---
