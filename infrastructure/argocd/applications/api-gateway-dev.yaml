apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: api-gateway-dev
    app.kubernetes.io/part-of: elice-microservices
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: elice-microservices-dev
  
  source:
    repoURL: https://github.com/dongkoony/microservices-gitops
    targetRevision: main
    path: applications/api-gateway/overlays/dev
  
  destination:
    server: https://kubernetes.default.svc
    namespace: elice-devops-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - Replace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  
  info:
  - name: Environment
    value: Development
  - name: Documentation
    value: https://github.com/dongkoony/microservices-gitops/wiki/api-gateway